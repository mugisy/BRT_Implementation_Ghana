[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brt-ghana"
version = "0.1.0"
description = "Modeling commuter willingness to switch to Bus Rapid Transit (BRT) in Kumasi, Ghana"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "shap>=0.42",
]

[project.optional-dependencies]
extras = ["pygam>=0.9", "lightgbm>=4.0", "xgboost>=1.7"]
dev = ["pytest>=7"]

[project.scripts]
brt-run = "brt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]